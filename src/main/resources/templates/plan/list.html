<!DOCTYPE html>
<html lang="ko" xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>구독 플랜 - Notemate</title>
</head>
<body>
<h1>구독 플랜</h1>

<a th:href="@{/}">홈으로</a>

<div th:if="${#lists.isEmpty(plans)}">
    <p>현재 판매 중인 구독 플랜이 없습니다.</p>
</div>

<ul th:if="${!#lists.isEmpty(plans)}">
    <li th:each="plan : ${plans}">
        <h2 th:text="${plan.name}">플랜명</h2>
        <p>
            가격:
            <span th:text="${plan.price}">0</span>원
        </p>
        
        <p>
            기간:
            <span th:text="${plan.durationDays}">30</span>일
        </p>
        <p th:text="${plan.description}">설명</p>

        <form th:action="@{/subscriptions/subscribe/{planId}(planId=${plan.id})}" method="post">
            <button type="submit">구독하기</button>
        </form>
    </li>
</ul>
</body>
</html>
