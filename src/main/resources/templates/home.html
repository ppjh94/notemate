<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notemate</title>
</head>
<body>
<h1>Notemate</h1>

<div th:if="${email != null}">
    <p>
        로그인 사용자:
        <strong th:text="${email}">user@example.com</strong>
    </p>
    <p>
        권한:
        <strong th:text="${role}">USER</strong>
    </p>

    <p>
        <a th:href="@{/contents}">콘텐츠 목록으로</a>
    </p>

    <p>
        <a th:href="@{/plans}">구독 플랜 보기</a>
    </p>

    <p>
        <a th:href="@{/admin/contents/new}">콘텐츠 등록</a>
    </p>

    <p>
        <a th:href="@{/admin/plans/new}">구독 플랜 등록</a>
    </p>
    
    <form th:action="@{/logout}" method="post">
        <button type="submit">로그아웃</button>
    </form>
</div>

<div th:if="${email == null}">
    <a th:href="@{/login}">로그인</a>
    <a th:href="@{/signup}">회원가입</a>
</div>
</body>
</html>
