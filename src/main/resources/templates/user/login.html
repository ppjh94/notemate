<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Notemate</title>
    <link rel="stylesheet" th:href="@{/css/user/login.css}">
</head>
<body>
<div class="login-container">
    <h1 class="login-title">Notemate 로그인</h1>

    <form th:action="@{/login}" method="post" class="login-form">
        <div class="form-group">
            <label for="username">이메일</label>
            <input id="username" name="username" type="email" placeholder="이메일을 입력하세요" required>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" required>
        </div>

        <p class="error-message" th:if="${param.error}">
            이메일 또는 비밀번호가 올바르지 않습니다.
        </p>

        <button type="submit">로그인</button>
    </form>

    <p class="signup-link">
        아직 계정이 없으신가요?
        <a th:href="@{/signup}">회원가입</a>
    </p>
</div>
</body>
</html>
