<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - Notemate</title>
    <link rel="stylesheet" th:href="@{/css/user/signup.css}">
</head>
<body>
<div class="signup-container">
    <h1 class="signup-title">Notemate 회원가입</h1>

    <form th:action="@{/signup}" th:object="${signupRequest}" method="post" class="signup-form">
        <div class="form-group">
            <label for="email">이메일</label>
            <input id="email" type="email" th:field="*{email}" placeholder="이메일을 입력하세요">
            <p class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input id="password" type="password" th:field="*{password}" placeholder="비밀번호를 입력하세요">
            <p class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div class="form-group">
            <label for="name">이름</label>
            <input id="name" type="text" th:field="*{name}" placeholder="이름을 입력하세요">
            <p class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <button type="submit">회원가입</button>
    </form>

    <p class="login-link">
        이미 계정이 있으신가요?
        <a th:href="@{/login}">로그인</a>
    </p>
</div>
</body>
</html>
