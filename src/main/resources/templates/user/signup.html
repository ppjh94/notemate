<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - Notemate</title>
  <link rel="stylesheet" th:href="@{/css/user/signup.css}">
</head>
<body>
  <div class="signup-container">
    <h1 class="signup-title">Notemate 회원가입</h1>
    
    <form id="signupForm" class="signup-form">
      <div class="form-group">
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" placeholder="이메일을 입력하세요">
        <p class="error-message" id="emailError"></p>
      </div>
      
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요">
        <p class="error-message" id="passwordError"></p>
      </div>

      <div class="form-group">
        <label for="name">이름</label>
        <input id="name" name="name" type="text" placeholder="이름을 입력하세요">
        <p class="error-message" id="nameError"></p>
      </div>
      
      <button type="submit" id="signupButton">회원가입</button>
    </form>
    
     <p class="login-link">
        이미 계정이 있으신가요?
        <a th:href="@{/login}">로그인</a>
    </p>
  </div>

  <script th:src="@{/js/user/signup.js}"></script>
</body>
</html>
